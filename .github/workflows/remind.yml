name: Cook reminder

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 8:00 AM IST
  workflow_dispatch:        # "Run workflow" button for manual testing

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python remind.py
        env:
          PHONE: ${{ secrets.PHONE }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
